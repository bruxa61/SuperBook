{% extends 'base.html' %}
{% load static %}

{% block title %}SuperBook - Vilões{% endblock %}

{% block body_class %}villain-theme{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/viloes.css' %}">
<style>
/* Tema específico para vilões */
.villain-theme {
    background: var(--villain-bg);
    color: var(--neutral-white);
    background-image: 
        radial-gradient(circle at 20% 80%, rgba(220, 38, 38, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
}

.villain-theme .container {
    position: relative;
}

.villain-theme .container::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="villain-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(220,38,38,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23villain-grid)"/></svg>');
    z-index: -1;
    opacity: 0.3;
}

.villain-theme .navbar-custom {
    background: var(--villain-gradient);
    box-shadow: var(--shadow-xl), var(--villain-glow);
}

.villain-theme .brand-title {
    background: var(--villain-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px rgba(220, 38, 38, 0.5);
}

.villain-theme .character-card {
    background: var(--neutral-gray-800);
    border: 1px solid var(--neutral-gray-600);
    color: var(--neutral-white);
    border-left: 4px solid var(--villain-secondary);
}

.villain-theme .character-card::before {
    background: var(--villain-gradient);
}

.villain-theme .character-card:hover {
    box-shadow: var(--shadow-xl), var(--villain-glow);
    border-color: var(--villain-secondary);
}

.villain-theme .card-title {
    color: var(--villain-secondary);
}

.villain-theme .section-title {
    background: var(--villain-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.villain-theme .section-title::after {
    background: var(--villain-gradient);
}

.villain-theme .btn-primary {
    background: var(--villain-gradient);
    border: none;
}

.villain-theme .btn-primary:hover {
    background: var(--villain-primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg), var(--villain-glow);
}

.villain-theme .btn-outline-primary {
    border-color: var(--villain-secondary);
    color: var(--villain-secondary);
}

.villain-theme .btn-outline-primary:hover {
    background: var(--villain-secondary);
    border-color: var(--villain-secondary);
    color: var(--neutral-white);
}

.villain-theme .progress-bar {
    background: var(--villain-gradient) !important;
}

.villain-theme .text-primary {
    color: var(--villain-secondary) !important;
}

.villain-theme .bg-primary {
    background: var(--villain-gradient) !important;
}

.villain-theme .stat-card {
    background: var(--neutral-gray-800);
    border: 1px solid var(--neutral-gray-600);
    color: var(--neutral-white);
}

.villain-theme .stat-card:hover {
    box-shadow: 0 8px 20px rgba(220, 38, 38, 0.2);
}

.villain-theme .form-control {
    background: var(--neutral-gray-800);
    border: 1px solid var(--neutral-gray-600);
    color: var(--neutral-white);
}

.villain-theme .form-control:focus {
    background: var(--neutral-gray-800);
    border-color: var(--villain-secondary);
    color: var(--neutral-white);
    box-shadow: 0 0 0 0.2rem rgba(220, 38, 38, 0.25);
}

.villain-theme .input-group-text {
    background: var(--neutral-gray-700);
    border: 1px solid var(--neutral-gray-600);
    color: var(--neutral-white);
}

.villain-theme .dropdown-menu {
    background: var(--neutral-gray-800);
    border: 1px solid var(--neutral-gray-600);
}

.villain-theme .dropdown-item {
    color: var(--neutral-white);
}

.villain-theme .dropdown-item:hover {
    background: var(--villain-secondary);
    color: var(--neutral-white);
}

.villain-theme footer {
    background: var(--neutral-gray-900);
    border-top: 1px solid var(--neutral-gray-700);
    color: var(--neutral-gray-300);
}

/* Efeitos especiais para vilões */
.villain-theme .character-card {
    position: relative;
    overflow: hidden;
}

.villain-theme .character-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(220, 38, 38, 0.1), transparent);
    transform: rotate(45deg);
    transition: all 0.5s ease;
    opacity: 0;
}

.villain-theme .character-card:hover::after {
    animation: villain-shine 1s ease-in-out;
}

@keyframes villain-shine {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0; }
}

/* Scrollbar para tema vilão */
.villain-theme ::-webkit-scrollbar-thumb {
    background: var(--villain-gradient);
}

.villain-theme ::-webkit-scrollbar-thumb:hover {
    background: var(--villain-primary);
}

.villain-theme ::-webkit-scrollbar-track {
    background: var(--neutral-gray-800);
}
</style>
{% endblock %}
